services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handyhome
      POSTGRES_PASSWORD: handyhome
      POSTGRES_DB: handyhome
    ports:
      - "5432:5432"
    volumes:
      - handyhome_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handyhome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  handyhome_pg:
